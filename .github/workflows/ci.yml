name: ci

# lab-management-system-contract-test
# 推送链:
# - branch push(master/main) → 跑 contract-test（对齐门禁 L1-L5）
# - tag push 不部署 —— 本仓是验证层，不是业务仓
# 镜像名/路径用 ${{ github.event.repository.name }} 避免跨仓劫持。
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  contract-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    # 3 真后端共一个 PG（lab_dev + V015 smoke seed）。
    # contract-test-run-live.md 共库约定：aspnetcore/springboot/nextjs 共享 PG。
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: lab
          POSTGRES_PASSWORD: lab
          POSTGRES_DB: lab_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready -U lab
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://lab:lab@localhost:5432/lab_dev?schema=public
      # JWT 全家共享（ADR-0019 各后端缺 key 即 fail-fast；且「前端不可区分」要求
      # A 后端签的 token B 后端能验 —— 三方必须同一把 key，job 级统一注入）。
      # JWT_TTL_SECONDS / JWT_REFRESH_TTL_SECONDS 缺失时 aspnetcore/springboot
      # 启动即崩（2026-09-13 补齐，对齐 saas ci.yml + aspnetcore .env.example；
      # start-family.sh 同步）。
      JWT_SIGNING_KEY: dev-key-32-bytes-minimum-length!
      JWT_ISSUER: lab-management-system
      JWT_AUDIENCE: lab-management-system-clients
      JWT_TTL_SECONDS: "3600"
      JWT_REFRESH_TTL_SECONDS: "604800"
      # CORS allowlist（契约值 = 两后端 .env.example；aspnetcore RequireCorsOrigins
      # fail-fast，缺失启动即崩）。dev 目录登录密码（两后端 key 拼法不同都给）。
      LAB_CORS_ALLOWED_ORIGINS: http://localhost:5201,http://localhost:5202,http://localhost:5203,http://localhost:5101
      LAB_AUTH_DEV_PASSWORD: dev123456
      Lab__Auth__DevPassword: dev123456
      # springboot 恒真链 SSO env（no-sso profile 已删，2026-09-20 人裁）：SaasAuthClient
      # 构造期 fail-fast，5 个 saas key 缺一启动即崩；BASE_URL 指黑洞端口——瞬时
      # ECONNREFUSED → 登录降级空菜单快照（与 SAAS_IDP_URL 同款），比对不依赖外部 saas。
      LAB_SAAS_BASE_URL: http://127.0.0.1:9
      LAB_SAAS_CLIENT_ID: lab-management
      LAB_SAAS_CLIENT_SECRET: lab-management-secret
      LAB_SAAS_DEFAULT_TENANT_ID: "00000000-0000-0000-0000-000000000001"
      LAB_SAAS_SERVICE_USER: alice
      LAB_SAAS_SERVICE_PASSWORD: dev123456
      LAB_SAAS_SERVICE_CLIENT_ID: lab-management
      # nextjs login route requireEnv(SAAS_IDP_URL)，缺失登录 500 级联全挂。
      # 指黑洞端口：serviceLogin 瞬时失败 → 空菜单快照（saas 不可达降级语义，契约等价），
      # live/CI 三方比对不依赖外部 saas 部署（start-family.sh 同步）。
      SAAS_IDP_URL: http://127.0.0.1:9
      TRACE_MAP: "1"
      CONTRACT_TARGETS: nextjs,aspnetcore,springboot
      # 2026-09-02 lab 与 saas 家族端口错开可并行（conventions §6 + contract-test-run-live.md）。
      # 端口：nextjs=5201, aspnetcore=5204, springboot=5205（conventions §6 lab=5200 段）。
      # 声明序首位 = 比对基准 probes[0]（2026-09-15 Phase 2 去 msw，spec §3.3）。

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          registry-url: https://registry.npmmirror.com/

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Install contract-test deps
        run: npm ci --registry=https://registry.npmmirror.com

      # shared 仓作为 sibling 被 checkout（gen:shared 读 ../lab-management-system-shared/...）
      # multi-repo-family.md §2 强制 sibling 引用，不以包依赖 import
      - name: Checkout shared sibling
        run: git clone --depth 1 https://x-access-token:${GITHUB_TOKEN}@github.com/zcqiand/lab-management-system-shared.git ../lab-management-system-shared

      # 3 后端作为 sibling 被 checkout
      - name: Checkout backend siblings
        run: |
          set -e
          for repo in aspnetcore springboot nextjs; do
            git clone --depth 1 https://x-access-token:${GITHUB_TOKEN}@github.com/zcqiand/lab-management-system-$repo.git ../lab-management-system-$repo
          done

      # 各仓依赖安装（前置，避免 healthcheck 阶段再 compile）
      - name: aspnetcore restore
        working-directory: ../lab-management-system-aspnetcore
        run: dotnet restore src/Lab.AspNetCore.csproj

      - name: springboot install (offline-able)
        working-directory: ../lab-management-system-springboot
        run: mvn -q -DskipTests dependency:go-offline

      - name: nextjs install
        working-directory: ../lab-management-system-nextjs
        run: npm ci --registry=https://registry.npmmirror.com

      # nextjs 跑前需要从 shared OpenAPI 重新生成端点类型
      - name: nextjs gen:shared
        working-directory: ../lab-management-system-nextjs
        run: npm run gen:shared

      # 起 3 后端 + healthcheck + vitest（核心步骤）
      # - 后台 nohup ... & 启 3 进程，PID 入 PIDS 数组
      # - trap cleanup EXIT 确保 step exit 时清理所有子进程 + 兜底 pkill 孙子
      # - healthcheck 串行 90s，任一 return 1 → set -e → step fail → trap 触发
      # - npx --no vitest run 必须在所有 3 后端 healthcheck 通过后才跑
      # 注：路径 `src/Lab.AspNetCore.csproj` 与 nextjs `gen:shared` 命令名
      # 按实际仓当前 PR 微调——子仓改动时这里同步改，不要盲目照搬。
      - name: Run 3 backends + healthcheck + vitest
        working-directory: .
        run: |
          set -e
          mkdir -p .runtime-logs
          PIDS=()

          # DATABASE_URL 三方言按后端注入：上方 job 级 postgresql:// URI 只服务 nextjs
          # （postgres.js 只吃 URI；?schema=public 是 Npgsql 不认的关键字）。aspnetcore
          # 的 Npgsql 走 Host=... 关键字形态（镜像 start-family.sh ASPNETCORE_PG_URL 与
          # aspnetcore deploy 注入），LAB_DATA_PROVIDER=ef 在 aspnetcore 批收敛恒 ef 后
          # 成死键，保留至该批落地供过渡。springboot 吃 jdbc: 前缀。
          (cd ../lab-management-system-aspnetcore && nohup env LAB_DATA_PROVIDER=ef \
            DATABASE_URL="Host=localhost;Port=5432;Database=lab_dev;Username=lab;Password=lab" \
            dotnet run --project src/Lab.AspNetCore.csproj > .runtime-logs/aspnetcore.log 2>&1) & PIDS+=($!)
          (cd ../lab-management-system-springboot && nohup env \
            DATABASE_URL="jdbc:postgresql://localhost:5432/lab_dev" DATABASE_USER=lab DATABASE_PASSWORD=lab \
            mvn -q spring-boot:run > .runtime-logs/springboot.log 2>&1) & PIDS+=($!)
          (cd ../lab-management-system-nextjs && nohup npm run dev > .runtime-logs/nextjs.log 2>&1) & PIDS+=($!)

          cleanup() {
            echo "::group::cleanup: killing ${#PIDS[@]} children + grandchildren"
            for p in "${PIDS[@]}"; do kill -TERM "$p" 2>/dev/null || true; done
            pkill -f Lab.AspNetCore     2>/dev/null || true
            pkill -f spring-boot:run    2>/dev/null || true
            pkill -f next-server        2>/dev/null || true
            echo "::endgroup::"
          }
          trap cleanup EXIT

          healthcheck() {
            local name=$1 url=$2
            for i in $(seq 1 90); do
              if curl -sf -o /dev/null --max-time 2 "$url"; then
                echo "ok $name up after ${i}s"
                return 0
              fi
              sleep 1
            done
            echo "::error::$name healthcheck failed at $url within 90s"
            echo "::group::$name log tail-30"
            tail -n 30 ".runtime-logs/$name.log" || true
            echo "::endgroup::"
            return 1
          }

          # lab 家族端口（2026-09-02 起与 saas 错开可并行，见 conventions §6）
          healthcheck aspnetcore http://localhost:5204/health
          healthcheck springboot http://localhost:5205/actuator/health
          healthcheck nextjs     http://localhost:5201/api/health

          npx --no vitest run

      # 上传 .runtime-logs/ 供失败时排查（3 后端的 log 各 tail 100 已能定位）
      - name: Upload backend logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-logs
          path: .runtime-logs/
          if-no-files-found: ignore

      # L3 typecheck（独立 step，避免 vitest 失败的 stderr 干扰）
      - name: L3 typecheck
        run: npx --no tsc --noEmit

      # L5 alignment + 全 gate
      # suite 根目录跑 gate.py，自动定位合同仓
      - name: L5 alignment + gate
        working-directory: ..
        run: |
          python scripts/checks/_alignment.py -p lab-management-system-contract-test
          python scripts/gate.py -p lab-management-system-contract-test