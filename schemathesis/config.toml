# Schemathesis 4.27.3 配置（TSP SSOT 清理 Phase E1，2026-09-17）+ ADR-0036 全 method 扩。
#
# 为什么是 config.toml 不是 config.yaml：schemathesis 4.27.3 的 --config-file
# 只认 TOML（.yaml 后缀会被按 TOML 解析直接报错，实测）。设计文档写的
# config.yaml 以此为准修正。
#
# ADR-0036 §5 范围扩：默认全 method 跑（GET/POST/PUT/PATCH/DELETE）。
# method 范围由 run.py 决定（不带 --include-method）；run.py 解析 openapi.yaml
# 的 x-fuzz: skip 扩展，转 schemathesis 4.x 的 --exclude-path + --exclude-method
# CLI 对（path+method AND 排除）。
#
# 单一修改点：shared 仓 .tsp 文件加 // fuzz:skip 注释 → emit-openapi.ts 后处理
# 注入 openapi.yaml 的 x-fuzz: skip → run.py 解析生成 --exclude-path +
# --exclude-method 对。本文件不再维护 [[operations]] 排除清单（避免与 shared .tsp
# 双源漂移）。

# ── checks：三个起点检查，其余全关 ──────────────────────────────
# not_a_server_error        —— 未文档化 5xx（SSOT 清理的头号猎物）
# status_code_conformance   —— 返回码必须在 OpenAPI 声明集合内
# response_schema_conformance —— 响应体必须符合声明的 schema
[checks]
enabled = false  # 先全体关闭，下面三个显式重开

[checks.not_a_server_error]
enabled = true

[checks.status_code_conformance]
enabled = true

[checks.response_schema_conformance]
enabled = true

# ── phases ──────────────────────────────────────────────────────
# ADR-0036 §5：stateful 重新开启。schemathesis 4.x stateful testing 默认模式就是
# links（自动跟踪 response.id 并 cleanup）；不是 CLI 参数控制。
# examples/coverage/fuzzing 保持默认开启。
# v0.1 起点；v0.2 加 invariant 差集兜底。
[phases.stateful]
enabled = true

# ── 逐端点豁免 ─────────────────────────────────────────────────
# 格式：[[operations]] + include-path/include-method 选端点 + 覆写字段。
# 铁律：每条豁免必须带理由注释；「真后端 bug / 契约漂移」禁止豁免，
# 只豁免「已文档化/有意的怪癖」。目前没有需要豁免的端点。
#
# [[operations]]
# include-path = "/api/example/{id}"
# include-method = "get"
# [operations.checks.status_code_conformance]
# enabled = false
# # 理由：……
